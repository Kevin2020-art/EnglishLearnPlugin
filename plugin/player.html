<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="英语精听" />
  <link rel="apple-touch-icon" href="icons/icon128.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>英语听力与双语字幕精听播放器</title>
  <link rel="stylesheet" href="player.css?v=20261107_4" />
</head>
<body>
  <div class="app-container">
    <!-- 顶部栏：目录选择与课程切换 -->
    <header class="top-bar">
      <div class="top-bar-left">
        <h1 class="app-title">🎧 英语双语精听播放器</h1>
        <button id="selectDirBtn" type="button" class="btn btn-primary folder-btn">
          📁 选择目录 (电脑)
        </button>
        <input id="dirInput" type="file" webkitdirectory directory multiple hidden />

        <button id="selectFilesBtn" type="button" class="btn btn-outline file-btn">
          📱 选文件 (手机端)
        </button>
        <input id="filesInput" type="file" multiple hidden />

        <div id="lessonSelectWrap" class="lesson-select-wrap hidden">
          <label for="lessonSelect">当前目录课程：</label>
          <select id="lessonSelect" class="lesson-select"></select>
        </div>
      </div>

      <div class="top-bar-right">
        <span id="statusBadge" class="status-badge">请选择包含 mp3 和字幕的目录（如 resources）</span>
      </div>
    </header>

    <!-- 全文双语字幕列表 -->
    <main class="subtitle-list-container">
      <div id="subtitleList" class="subtitle-list">
        <div class="empty-state">
          <div class="empty-icon">📂</div>
          <p>尚未加载播放目录</p>
          <p class="empty-hint">
            电脑端请点击 <strong>「📁 选择目录 (电脑)」</strong> 选择 <code>resources</code> 文件夹；<br />
            iPhone 端请点击 <strong>「📱 选文件 (iPhone/iCloud)」</strong> 在 iCloud 文件中同时勾选 <code>1个mp3 + 2个txt/md</code> 即可自动对齐播放。
          </p>
        </div>
      </div>
    </main>

    <!-- 底部控制栏 -->
    <footer class="control-bar">
      <!-- 进度条 -->
      <div class="progress-row">
        <span id="currentTimeLabel" class="time-label">00:00</span>
        <input id="progressBar" type="range" class="progress-bar" min="0" max="100" step="0.01" value="0" disabled />
        <span id="durationLabel" class="time-label">00:00</span>
      </div>

      <!-- 按钮控制区 -->
      <div class="controls-row">
        <!-- 左侧占位/当前状态指示 -->
        <div class="playback-state-box">
          <span id="playStateDot" class="state-dot stopped"></span>
          <span id="playStateText" class="state-text">已停止</span>
        </div>

        <!-- 中间核心播放控制：一体化手势触控长条（短按播放/暂停/继续，左滑放开上一句，右滑放开下一句，快速短按3下停止） -->
        <div id="gestureBar" class="gesture-bar disabled" role="button" tabindex="0" title="短按：播放/暂停/继续 | 按下左滑放开：上一句 | 按下右滑放开：下一句 | 快速短按3下：停止">
          <div class="gesture-hint gesture-hint-left">
            <span class="hint-icon">⏮</span>
            <span class="hint-text">上一句</span>
          </div>
          <div class="gesture-core">
            <span id="gestureActionIcon" class="gesture-action-icon">▶</span>
            <span id="gestureActionText" class="gesture-action-text">点击播放</span>
          </div>
          <div class="gesture-hint gesture-hint-right">
            <span class="hint-text">下一句</span>
            <span class="hint-icon">⏭</span>
          </div>
        </div>

        <!-- 右侧中英文显示/隐藏控制 -->
        <div class="visibility-buttons">
          <button id="toggleEnBtn" class="btn btn-toggle active">👁️ 隐藏英文</button>
          <button id="toggleZhBtn" class="btn btn-toggle active">👁️ 隐藏中文</button>
        </div>
      </div>
    </footer>
  </div>

  <audio id="audioPlayer" preload="auto"></audio>
  <script src="player.js?v=20261107_4"></script>
</body>
</html>
